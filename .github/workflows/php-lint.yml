name: PHP Lint

# このリポジトリには「1 ファイルに複数ファイル分のコードが連結されている」
# 「<?php 開始タグが無い」「同名クラスが複数のファイルで宣言されている」
# といった、読み込んだ瞬間に落ちるファイルが繰り返し混入していた。
#
# 検査の中身は tools/check-repo.php に置いてある。
# ワークフローに直接シェルを書くと手元で再現できないため、
# リポジトリに入れて手元でも同じコマンドで走らせられるようにしている。
#
#     php tools/check-repo.php

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: check-repo (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 現行の安定版と、1 つ前のバージョン。
        # 8.4 では暗黙の nullable 引数などが Deprecated になるため、
        # 両方で確認しておく。
        php-version: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none

      - name: Repository health check
        run: php tools/check-repo.php
